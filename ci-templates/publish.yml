# Publish kimss-forge to PyPI from the public mirror (tag-driven).
# Restored onto kimss-ai/kimss-forge after each subtree mirror (or copy once).
# Trusted Publisher: PyPI project kimss-forge ← GitHub kimss-ai/kimss-forge, workflow publish.yml

name: Publish kimss-forge to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install -U build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
